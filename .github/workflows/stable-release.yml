name: Stable v1 release
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run release:check
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run check
      - run: npm install --no-save --package-lock=false playwright
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: node test/ci-browser.mjs ${{ matrix.browser }}
  safari:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run check
      - run: sudo safaridriver --enable
      - run: node test/safari-webdriver.mjs
  publish:
    needs: [package, browser, safari]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: pfx-css-motion-core-v1.0.0
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Confirm release manifest
        run: |
          node -e 'const p=require("./package.json");if(p.version!=="1.0.0"||p.license!=="Apache-2.0"||Object.keys(p.dependencies||{}).length)process.exit(1)'
      - name: Build distributable archive
        run: npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP"
      - name: Create GitHub Release and tag once
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="v1.0.0"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; no duplicate tag created"
            exit 0
          fi
          gh release create "$TAG" "$RUNNER_TEMP/pfxamd-css-motion-core-1.0.0.tgz" --target "$GITHUB_SHA" --title "PFx CSS Motion Core v1.0.0" --notes-file CHANGELOG.md
