<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>PFx CSS Motion Core browser conformance</title></head>
<body>
<pre id="results">Running...</pre>
<script type="module">
import { sampleTiming, compileCSS, createMotion } from '../src/index.js';
const failures = [];
let mismatchCount = 0;
let knownSafariEndpointDifferenceCount = 0;
let unexpectedMismatchCount = 0;
const unexpectedDifferences = [];
const mismatchByCategory = {};
let samples = 0;
const box = document.createElement('div');
document.body.append(box);
for (const duration of [0,100,800]) {
  for (const iterations of [0,.5,1,2,2.5,3]) {
    for (const direction of ['normal','reverse','alternate','alternate-reverse']) {
      for (const delay of [0,20,-50]) {
        for (const endDelay of [0,-20,20]) {
          const timing = {duration,iterations,direction,delay,endDelay,fill:'both'};
          const animation = box.animate([{opacity:0},{opacity:1}],{...timing,easing:'linear'});
          animation.pause();
          const endTime = Math.max(0,delay+duration*iterations+endDelay);
          for(const time of [0,1,50,99,100,100.001,200,400,800,801,1600,2400,endTime]){
            animation.currentTime = time;
            const native = animation.effect.getComputedTiming().progress;
            const core = sampleTiming(timing,time).progress;
            if ((native === null) !== (core === null) ||
                (native !== null && Math.abs(native-core)>1e-7)) {
              mismatchCount++;
              // W3C Web Animations 4.8.3.3: a completed integer iteration with
              // forwards fill must retain its final endpoint, not wrap to 0.
              // Safari 26.6.1 sometimes reports un-clamped modulo progress there.
              const activeEnd = delay + duration * iterations;
              const endTime = Math.max(0, activeEnd + endDelay);
              const safariFinalBoundary = /Safari\//.test(navigator.userAgent) &&
                !/Chrome\//.test(navigator.userAgent) &&
                Number.isInteger(iterations) && iterations > 0 && duration > 0 &&
                time >= Math.max(0, Math.min(activeEnd, endTime)) &&
                time >= activeEnd && (core === 0 || core === 1) &&
                native !== null && Number.isFinite(native);
              if (safariFinalBoundary) knownSafariEndpointDifferenceCount++;
              else {
                unexpectedMismatchCount++;
                if (unexpectedDifferences.length < 15) unexpectedDifferences.push({timing,time,native,core});
              }
              const category = 'duration=' + duration + ';iterations=' + iterations + ';delay=' + delay + ';time=' + time;
              mismatchByCategory[category] = (mismatchByCategory[category] || 0) + 1;
              if(failures.length < 30) failures.push({timing,time,native,core});
            }
            samples++;
          }
          animation.cancel();
        }
      }
    }
  }
}
box.remove();
const result = compileCSS(createMotion({
  id:'browser-check',timing:{duration:1000,fill:'both'},
  keyframes:[{opacity:0,transform:'translateX(0px)'},{opacity:1,transform:'translateX(100px)'}]
}));
const style = document.createElement('style');style.textContent = result.css;document.head.append(style);
const element = document.createElement('div');element.className=result.className;document.body.append(element);
const animation = element.getAnimations()[0];
if(animation){animation.pause();animation.currentTime=500;}
const computed = getComputedStyle(element);
const midpointCSS = !!animation && Math.abs(Number(computed.opacity)-.5)<=1e-7 &&
  Math.abs(new DOMMatrixReadOnly(computed.transform).m41-50)<=1e-7;
const finalCSS = {};
if (animation) {
  animation.currentTime=1000.001;
  finalCSS.justAfter = Number(getComputedStyle(element).opacity);
  animation.currentTime=3000;
  finalCSS.wellAfter = Number(getComputedStyle(element).opacity);
}
const finalCSSValid = Math.abs(finalCSS.justAfter - 1)<=1e-7 &&
  Math.abs(finalCSS.wellAfter - 1)<=1e-7;
const validCSS = midpointCSS && finalCSSValid;
const report={samples,mismatchCount,knownSafariEndpointDifferenceCount,
  unexpectedMismatchCount,unexpectedDifferences,mismatchByCategory,failures,
  validCSS,midpointCSS,finalCSS,finalCSSValid,
  strictNativeParity:mismatchCount===0,
  passed:mismatchCount===0&&validCSS,
  specCompatibleWithDocumentedSafariDeviation:unexpectedMismatchCount===0&&validCSS,
  browser:navigator.userAgent};
document.getElementById('results').textContent=JSON.stringify(report,null,2);
document.title = report.passed ? 'PASS — PFx browser conformance' : 'FAIL — PFx browser conformance';
window.pfxConformanceResult = report;
</script></body></html>
